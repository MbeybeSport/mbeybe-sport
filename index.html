<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MBEYBE SPORT — Équipez vos ambitions</title>
<meta name="description" content="Mbeybe Sport : maillots, chaussures, équipements et tenues personnalisées en Mauritanie. Commande par WhatsApp, paiement Wave, Bankily, Masrvi, Sedad.">
<link rel="icon" href="images/logo-emblem.jpg">
<meta name="theme-color" content="#0b6b3a">
<meta property="og:type" content="website">
<meta property="og:site_name" content="MBEYBE SPORT">
<meta property="og:title" content="MBEYBE SPORT — Équipez vos ambitions">
<meta property="og:description" content="Maillots, chaussures et équipements de sport en Mauritanie. Commande par WhatsApp.">
<meta property="og:image" content="https://mbeybesport.github.io/mbeybe-sport/images/logo.jpg">
<meta property="og:url" content="https://mbeybesport.github.io/mbeybe-sport/">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--brand:#0b6b3a;--brand-d:#08522c;--accent:#f5b400;--ink:#14181f;--muted:#6b7280;--line:#e5e7eb;--bg:#fff;--soft:#f6f7f9;--danger:#e11d48;--radius:12px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Poppins','Cairo',system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5}
body.rtl{direction:rtl;font-family:'Cairo','Poppins',sans-serif}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.container{max-width:1240px;margin:0 auto;padding:0 16px}

/* Barre d'annonce */
.topbar{background:var(--brand);color:#fff;font-size:13px}
.topbar .container{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:7px;padding-bottom:7px;flex-wrap:wrap}
.topbar select{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:6px;padding:2px 6px;font:inherit;font-size:12px}
.topbar select option{color:#000}
.topbar .tools{display:flex;gap:8px;align-items:center}

/* En-tête */
header.site{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line)}
.head-row{display:flex;align-items:center;gap:20px;padding:12px 0}
.logo{font-weight:800;font-size:22px;letter-spacing:.5px;color:var(--brand);display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo span{background:var(--accent);color:#000;border-radius:6px;padding:0 7px}
.logo-img{height:46px;width:auto;display:block}
.logo b{font-weight:800}
.foot-logo{background:#fff;border-radius:12px;padding:10px;width:170px;margin-bottom:12px}
.foot-logo img{width:100%;height:auto;display:block}
.search{flex:1;display:flex;max-width:520px;border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.search input{flex:1;border:0;padding:10px 16px;font:inherit;outline:none;min-width:0;background:transparent}
.search button{padding:0 18px;background:var(--brand);color:#fff;font-weight:600}
.cart-btn{position:relative;padding:8px 14px;border:1.5px solid var(--line);border-radius:999px;font-weight:600;white-space:nowrap}
.cart-btn b{position:absolute;top:-8px;inset-inline-end:-6px;background:var(--danger);color:#fff;font-size:11px;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 4px}
.burger{display:none;font-size:24px}
nav.menu{border-top:1px solid var(--line)}
nav.menu ul{list-style:none;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
nav.menu a{display:block;padding:12px 16px;font-weight:600;font-size:14px;white-space:nowrap;border-bottom:3px solid transparent}
nav.menu a:hover,nav.menu a.on{color:var(--brand);border-color:var(--accent)}

/* Bannière (slider) */
.hero{position:relative;overflow:hidden;background:#0a1f14}
.slides{display:flex;transition:transform .6s ease}
body.rtl .slides{direction:ltr}
.slide{min-width:100%;min-height:420px;display:grid;place-items:center;text-align:center;color:#fff;padding:56px 20px;position:relative}
.slide .in{max-width:720px;position:relative;z-index:1}
.slide h1{font-size:clamp(26px,4.5vw,46px);line-height:1.15;font-weight:800;margin-bottom:12px}
.slide p{font-size:clamp(14px,2vw,18px);opacity:.92;margin-bottom:24px}
.s1{background:linear-gradient(120deg,#0b6b3a,#073d22 60%,#0a1f14)}
.s2{background:linear-gradient(120deg,#1d3a8a,#0f1d4d 60%,#0a1020)}
.s3{background:linear-gradient(120deg,#b45309,#7c2d12 60%,#2b1005)}
.slide .big{position:absolute;font-size:260px;opacity:.12;inset-inline-end:3%;bottom:-40px;line-height:1}
.btn{display:inline-block;background:var(--accent);color:#000;font-weight:700;padding:13px 28px;border-radius:999px;transition:.2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.25)}
.btn.dark{background:var(--brand);color:#fff}
.dots{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:8px}
.dots i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.4);cursor:pointer}
.dots i.on{background:var(--accent);width:26px;border-radius:6px}

/* Sections */
section.block{padding:44px 0}
.sec-title{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px;gap:12px;flex-wrap:wrap}
.sec-title h2{font-size:26px;font-weight:700}
.sec-title h2:after{content:"";display:block;width:54px;height:4px;background:var(--accent);border-radius:2px;margin-top:6px}
.sec-title a{color:var(--brand);font-weight:600}

/* Perks */
.perks{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;padding:26px 0;border-bottom:1px solid var(--line)}
.perk{display:flex;gap:12px;align-items:center}
.perk .ic{font-size:28px;width:52px;height:52px;display:grid;place-items:center;background:var(--soft);border-radius:50%;flex:none}
.perk b{display:block;font-size:14px}
.perk small{color:var(--muted)}

/* Catégories */
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.cat{background:var(--soft);border:1.5px solid transparent;border-radius:var(--radius);padding:22px 10px;text-align:center;transition:.2s}
.cat:hover{border-color:var(--brand);background:#fff;transform:translateY(-3px);box-shadow:0 8px 22px rgba(0,0,0,.08)}
.cat .e{font-size:42px}
.cat span{display:block;font-weight:600;margin-top:8px}

/* Filtres */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.chip{padding:8px 16px;border:1.5px solid var(--line);border-radius:999px;font-size:13px;font-weight:600;background:#fff}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.filters select{padding:8px 12px;border:1.5px solid var(--line);border-radius:8px;font:inherit;font-size:13px;margin-inline-start:auto}

/* Produits */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.card{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:#fff;display:flex;flex-direction:column;transition:.2s;position:relative}
.card:hover{box-shadow:0 10px 28px rgba(0,0,0,.1);transform:translateY(-3px)}
.thumb{aspect-ratio:1/1;display:grid;place-items:center;font-size:84px;cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:contain;padding:6px}
.m-img img{width:100%;max-height:440px;object-fit:contain}
.line .t{overflow:hidden;background:#fff;border:1px solid var(--line)}
.line .t img{width:100%;height:100%;object-fit:contain}
.badge{position:absolute;top:10px;inset-inline-start:10px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px}
.card .body{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{font-size:14px;font-weight:600;line-height:1.35;min-height:38px}
.stars{color:var(--accent);font-size:13px;letter-spacing:1px}
.price{font-weight:700;font-size:16px;color:var(--brand)}
.price del{color:var(--muted);font-weight:400;font-size:13px;margin-inline-end:6px}
.card .add{margin-top:auto;background:var(--ink);color:#fff;border-radius:8px;padding:10px;font-weight:600;font-size:13px;transition:.2s}
.card .add:hover{background:var(--brand)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0}

/* Bannière promo */
.promo{border-radius:16px;padding:44px 28px;color:#fff;background:linear-gradient(110deg,#0b6b3a,#f59e0b 160%);display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.promo h3{font-size:clamp(22px,3.4vw,34px);font-weight:800}
.promo p{opacity:.92;margin-top:6px}

/* Avis */
.reviews{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.rev{background:var(--soft);padding:20px;border-radius:var(--radius)}
.rev p{margin:8px 0 12px;font-size:14px}
.rev b{font-size:13px}

/* Pied de page */
footer{background:#0d1117;color:#cbd5e1;margin-top:30px}
.foot{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:30px;padding:44px 0 30px}
footer h4{color:#fff;margin-bottom:12px}
footer li{list-style:none;margin:6px 0;font-size:14px}
footer a:hover{color:var(--accent)}
.pay{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.pay span{background:#1f2733;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;color:#fff}
.paybar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-top:18px;padding-bottom:18px;border-top:1px solid #1f2733}
.paybar>span{color:#fff;font-weight:600;font-size:14px}
.pay-groups{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start}
.pay-group{display:flex;flex-direction:column;gap:8px}
.pay-num{color:#fff;font-weight:700;font-size:15px;letter-spacing:.5px;direction:ltr;unicode-bidi:embed}
.pay-label{color:#cbd5e1;font-size:13px;font-weight:600}
.pay-group+.pay-group{padding-inline-start:28px;border-inline-start:1px solid #2a3544}
@media(max-width:600px){.pay-group+.pay-group{padding-inline-start:0;border-inline-start:0}}
.pay-logos{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.pay-logos img{height:44px;width:auto;background:#fff;border-radius:10px;padding:5px 12px;display:block}
.pay-logos img.wave{padding:0}
.copy{border-top:1px solid #1f2733;text-align:center;padding:16px;font-size:13px}

/* Panier (tiroir) */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.3s;z-index:90}
.overlay.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(430px,100%);background:#fff;z-index:100;transform:translateX(105%);transition:.35s;display:flex;flex-direction:column}
body.rtl .drawer{transform:translateX(-105%)}
.drawer.on{transform:none!important}
.d-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);font-weight:700;font-size:18px}
.d-body{flex:1;overflow:auto;padding:12px 20px}
.line{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.line .t{width:56px;height:56px;border-radius:10px;display:grid;place-items:center;font-size:30px;flex:none}
.line .i{flex:1;font-size:13px}
.line .i b{display:block;font-size:13.5px}
.qty{display:inline-flex;align-items:center;gap:8px;margin-top:6px}
.qty button{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);font-weight:700}
.rm{color:var(--danger);font-size:18px}
.d-foot{padding:16px 20px;border-top:1px solid var(--line)}
.total{display:flex;justify-content:space-between;font-weight:700;font-size:18px;margin-bottom:12px}
.wa-order{display:block;width:100%;text-align:center;background:#25d366;color:#fff;padding:14px;border-radius:10px;font-weight:700}

/* Fiche produit (modale) */
.modal{position:fixed;inset:0;display:none;place-items:center;z-index:110;padding:16px}
.modal.on{display:grid}
.m-box{background:#fff;border-radius:16px;max-width:760px;width:100%;display:grid;grid-template-columns:1fr 1fr;overflow:hidden;max-height:92vh;overflow-y:auto;position:relative}
.m-img{display:grid;place-items:center;font-size:150px;min-height:300px}
.m-info{padding:28px;display:flex;flex-direction:column;gap:12px}
.m-info h3{font-size:20px}
.sizes{display:flex;gap:8px;flex-wrap:wrap}
.sizes button{min-width:42px;padding:8px 12px;border:1.5px solid var(--line);border-radius:8px;font-weight:600}
.sizes button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.x{position:absolute;top:10px;inset-inline-end:14px;font-size:26px;z-index:2}

/* Boutons flottants */
.wa{position:fixed;bottom:20px;inset-inline-start:20px;width:60px;height:60px;border-radius:50%;background:#25d366;display:grid;place-items:center;box-shadow:0 8px 22px rgba(0,0,0,.28);z-index:60;transition:transform .2s}
.wa:hover{transform:scale(1.08)}
.wa svg{width:34px;height:34px;fill:#fff}
.up{position:fixed;bottom:20px;inset-inline-end:20px;width:44px;height:44px;border-radius:50%;background:var(--ink);color:#fff;font-size:20px;display:none;place-items:center;z-index:60}
.up.on{display:grid}

@media(max-width:820px){
 .burger{display:block}
 .search{order:5;flex-basis:100%;max-width:none}
 .head-row{flex-wrap:wrap;gap:10px}
 .logo{flex:1}
 nav.menu{display:none}nav.menu.on{display:block}
 nav.menu ul{flex-direction:column}
 .m-box{grid-template-columns:1fr}
 .m-img{min-height:200px;font-size:110px}
 .slide{min-height:340px}
}
.deliv{text-align:center;font-weight:600;font-size:14px;padding:14px 0 4px;color:#fff}
/* ===== Stock, toast, bouton admin ===== */
[hidden]{display:none!important}
.badge.out{background:#4b5563}
.is-out .thumb img{opacity:.4}
.thumb img{width:100%;height:100%;object-fit:contain;padding:6px}
.low{color:var(--danger);font-size:12px;font-weight:700}
.card .add:disabled,.btn:disabled{background:#9ca3af;color:#fff;cursor:not-allowed;transform:none;box-shadow:none}
.menu li.adm-li{margin-inline-start:auto}
.menu li.adm-li a{color:var(--muted);font-weight:500}
.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:#111827;color:#fff;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;z-index:300;font-size:14px;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.adm-pill{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:140;background:#0b2a1a;color:#fff;border-radius:999px;padding:10px 18px;font-weight:700;font-size:13px;box-shadow:0 8px 22px rgba(0,0,0,.3)}

.m-thumbs{display:flex;gap:8px;flex-wrap:wrap}
.m-thumbs button{width:54px;height:54px;border:2px solid var(--line);border-radius:8px;background:#fff;padding:0;overflow:hidden}
.m-thumbs button.on{border-color:var(--brand)}
.m-thumbs img{width:100%;height:100%;object-fit:contain}
.m-desc{font-size:14px;color:#374151}
.m-note{font-size:11px;color:var(--muted)}
.cust{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.cust label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.cust input{font:inherit;font-size:14px;padding:9px 10px;border:1.5px solid var(--line);border-radius:8px;width:100%;min-width:0;color:var(--ink)}
.infos{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.info{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px}
.info h3{font-size:16px;margin-bottom:8px}
.info p{font-size:14px;color:#374151}
.sizeg{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 18px}
.sizeg summary{font-weight:700;cursor:pointer}
.sizeg table{border-collapse:collapse;margin:12px 0 6px;font-size:14px;width:100%;max-width:520px}
.sizeg th,.sizeg td{border:1px solid var(--line);padding:6px 10px;text-align:center}
.sizeg th{background:var(--soft)}
.sizeg small{color:var(--muted);display:block;margin-top:6px}
.rev small{color:var(--muted)}
.notaff{text-align:center;font-size:12px;color:#94a3b8;padding:0 16px 10px}
/* ===== Espace admin ===== */
#admin,#login,#aModal{direction:ltr;text-align:left;font-family:'Poppins',system-ui,sans-serif}
#admin{position:fixed;inset:0;background:#f4f5f7;z-index:200;display:none;flex-direction:column;color:var(--ink)}
#admin.on{display:flex}
.a-head{background:#0b2a1a;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.a-head h2{font-size:17px;flex:1;min-width:160px}
.a-head .a-btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.45)}
.a-status{font-size:12px;font-weight:600;color:#a7f3d0}
.a-status.warn{color:#fcd34d}
.a-tabs{display:flex;gap:4px;padding:8px 16px 0;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}
.a-tab{padding:10px 16px;font-weight:600;font-size:14px;border-bottom:3px solid transparent;white-space:nowrap}
.a-tab.on{border-color:var(--accent);color:var(--brand)}
.a-body{flex:1;overflow:auto;padding:16px}
.a-wrap{max-width:1100px;margin:0 auto}
.a-wrap input:not([type=checkbox]):not([type=file]),.a-wrap select,.a-wrap textarea,.a-mbox input:not([type=checkbox]):not([type=file]),.a-mbox select{font:inherit;font-size:14px;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;min-width:0;width:100%;background:#fff;color:var(--ink)}
.a-wrap textarea{margin-top:10px;font-family:monospace;font-size:12px}
.a-btn{padding:8px 14px;border-radius:8px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:13px;cursor:pointer;display:inline-block;color:var(--ink)}
.a-btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.a-btn.danger{color:var(--danger);border-color:#fecdd3}
.a-btn.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.a-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.a-card h3{font-size:16px;margin-bottom:10px}
.a-hint{color:var(--muted);font-size:13px;margin:6px 0 10px}
.a-err{color:var(--danger);font-size:13px;min-height:18px;margin:8px 0}
.a-tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.a-tools input{flex:2;min-width:180px;width:auto!important}
.a-tools select{flex:1;min-width:160px;width:auto!important}
.a-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
.a-row{display:grid;grid-template-columns:56px minmax(150px,2fr) repeat(3,minmax(90px,1fr)) minmax(130px,auto) auto;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
.a-th{width:56px;height:56px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:8px}
.a-name{display:flex;flex-direction:column;gap:2px;font-size:14px;min-width:0}
.a-name small{color:var(--muted);font-size:12px}
.a-flags{display:flex;flex-direction:column;gap:4px;font-size:12px}
.a-flags label{display:flex;gap:6px;align-items:center;cursor:pointer}
.a-act{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;margin-inline-start:6px;display:inline-block;width:fit-content}
.pill.out{background:#fee2e2;color:#b91c1c}
.pill.gray{background:#e5e7eb;color:#374151}
.a-crow{display:grid;grid-template-columns:64px 1fr 1fr 1fr auto;gap:8px;align-items:center;margin-bottom:8px}
.a-crow .e{text-align:center}
.a-steps,.a-list{padding-inline-start:20px;font-size:14px;display:flex;flex-direction:column;gap:6px;margin:8px 0 14px}
code{background:#eef0f3;padding:1px 6px;border-radius:6px;font-size:12px}
.a-modal{position:fixed;inset:0;z-index:260;display:none;place-items:center;background:rgba(0,0,0,.5);padding:16px}
.a-modal.on{display:grid}
#login{z-index:270}
.a-mbox{background:#fff;border-radius:14px;max-width:640px;width:100%;max-height:92vh;overflow:auto;padding:20px;color:var(--ink)}
.a-mbox h3{margin-bottom:12px}
.a-photo{display:flex;gap:14px;align-items:flex-start;margin-bottom:14px}

/* ============ PANIER ============ */
function stockLeft(id){
  const p = PRODUCTS.find(x=>x.id===id); if(!p) return 0; if(p.stock===null) return Infinity;
  return p.stock - cart.filter(l=>l.id===id).reduce((s,l)=>s+l.q,0);
}
function addToCart(id,size,ext){
  ext = ext || {};
  const p = PRODUCTS.find(x=>x.id===id); if(!p || p.stock===0) return;
  if(stockLeft(id) <= 0){ toast(t("nomore")); return; }
  const key=id+"|"+(size||"")+"|"+(ext.n||"")+"|"+(ext.x||"");
  const l=cart.find(x=>x.key===key);
  if(l) l.q++; else cart.push({key,id,size:size||"",n:ext.n||"",x:ext.x||"",q:1});
  saveCart(); openDrawer();
}
function chg(key,d){
  const l=cart.find(x=>x.key===key); if(!l) return;
  if(d>0 && stockLeft(l.id) <= 0){ toast(t("nomore")); return; }
  l.q+=d; if(l.q<=0) cart=cart.filter(x=>x.key!==key); saveCart();
}
function rm(key){cart=cart.filter(x=>x.key!==key); saveCart();}
function saveCart(){safeSet("mb_cart",JSON.stringify(cart)); renderCart();}
function renderCart(){
  cart = cart.filter(l => { const p = PRODUCTS.find(x=>x.id===l.id); return p && p.stock !== 0; });
  $("#count").textContent = cart.reduce((s,l)=>s+l.q,0);
  $("#cartBody").innerHTML = cart.length ? cart.map(l=>{
    const p=PRODUCTS.find(x=>x.id===l.id);
    return `<div class="line"><div class="t"><img src="${esc(imgSrc(p.img))}" alt=""></div>
      <div class="i"><b>${esc(nm(p))}</b>${l.size?`${p.sizes==="shoe"?t("shoeSize"):t("size")}: ${esc(l.size)} · `:""}${(l.n||l.x)?`${esc(t("pPrint"))}: ${esc((l.n||"")+(l.n&&l.x?" ":"")+(l.x?"#"+l.x:""))} · `:""}${money(p.price)}
      <div class="qty"><button onclick="chg('${l.key}',-1)">−</button><span>${l.q}</span><button onclick="chg('${l.key}',1)">+</button></div></div>
      <button class="rm" onclick="rm('${l.key}')" aria-label="Supprimer">🗑</button></div>`;
  }).join("") : `<p class="empty" style="padding:40px 0;text-align:center;color:var(--muted)">${t("empty")}</p>`;
  const total = cart.reduce((s,l)=>s+PRODUCTS.find(x=>x.id===l.id).price*l.q,0);
  $("#cartTotal").textContent = money(total);
  const lines = cart.map(l=>{const p=PRODUCTS.find(x=>x.id===l.id);return `• ${l.q} × ${nm(p)}${l.size?" ("+l.size+")":""}${(l.n||l.x)?" ["+(l.n||"")+(l.n&&l.x?" ":"")+(l.x?"#"+l.x:"")+"]":""} — ${money(p.price*l.q)}`}).join("\n");
  $("#orderWa").href = cart.length ? waLink(t("waHello")+"\n"+lines+"\n"+t("total")+": "+money(total)) : waLink(t("waHi"));
}

      im.onload=()=>{ const r=Math.min(1,max/Math.max(im.width,im.height)); const c=document.createElement("canvas");
        c.width=Math.round(im.width*r); c.height=Math.round(im.height*r);
        const x=c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height); x.drawImage(im,0,0,c.width,c.height);
        res(c.toDataURL("image/jpeg",q)); };
      im.onerror=rej; im.src=fr.result; };
    fr.onerror=rej; fr.readAsDataURL(file);
  });
}

const GH_DEF={repo:"mbeybesport/mbeybe-sport",branch:"main",token:""};
function ghCfg(){ try{ return Object.assign({},GH_DEF,JSON.parse(safeGet("mb_gh")||"{}")); }catch(e){ return Object.assign({},GH_DEF); } }
function ghRead(){ return {repo:$("#gh-repo").value.trim()||GH_DEF.repo, branch:$("#gh-branch").value.trim()||GH_DEF.branch, token:$("#gh-token").value.trim()}; }
function b64utf8(str){ const by=new TextEncoder().encode(str); let bin=""; for(let i=0;i<by.length;i+=0x8000) bin+=String.fromCharCode.apply(null,by.subarray(i,i+0x8000)); return btoa(bin); }
async function ghPublish(){
  const c=ghRead(), msg=$("#ghMsg"), btn=$("#ghPubBtn"); msg.style.color=""; msg.textContent="";
  if(!c.token){ msg.textContent="Collez d'abord votre jeton GitHub."; return; }
  safeSet("mb_gh",JSON.stringify(c)); btn.disabled=true; btn.textContent="Publication…";
  const url="https://api.github.com/repos/"+c.repo+"/contents/products.json";
  const H={Authorization:"Bearer "+c.token,Accept:"application/vnd.github+json"};
  try{
    let sha; const r=await fetch(url+"?ref="+encodeURIComponent(c.branch),{headers:H,cache:"no-store"});
    if(r.status===200) sha=(await r.json()).sha; else if(r.status===401||r.status===403) throw new Error("Jeton refusé : vérifiez qu'il est valide et qu'il a la permission Contents : Read and write sur ce dépôt."); else if(r.status!==404) throw new Error("GitHub a répondu "+r.status+".");
    const snap=JSON.stringify(STORE);
    const body={message:"Mise à jour de la boutique depuis l'Admin",content:b64utf8(JSON.stringify(STORE,null,1)),branch:c.branch}; if(sha) body.sha=sha;
    const w=await fetch(url,{method:"PUT",headers:Object.assign({"Content-Type":"application/json"},H),body:JSON.stringify(body)});
    if(!w.ok){ if(w.status===401||w.status===403) throw new Error("Jeton refusé : permission Contents : Read and write manquante."); if(w.status===404) throw new Error("Dépôt ou branche introuvable : vérifiez « "+c.repo+" » et « "+c.branch+" »."); if(w.status===409||w.status===422) throw new Error("Conflit : rechargez la page admin et réessayez."); throw new Error("GitHub a répondu "+w.status+"."); }
    pubJSON=snap; if(JSON.stringify(STORE)===snap) safeDel("mb_draft");
    renderAdmin(); toast("Publié ! La boutique se met à jour dans 1 à 2 minutes.");
  }catch(err){ msg.textContent=(err&&err.message&&err.message!=="Failed to fetch")?err.message:"Connexion impossible. Vérifiez votre internet."; btn.disabled=false; btn.textContent="Publier maintenant"; }
}
function downloadJSON(){
  const blob=new Blob([JSON.stringify(STORE,null,1)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="products.json";
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function copyJSON(){
  const json=JSON.stringify(STORE,null,1), ta=$("#jsonOut");
  const fallback=()=>{ ta.value=json; ta.hidden=false; ta.focus(); ta.select(); toast("Sélectionné : faites Copier sur votre appareil"); };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(json).then(()=>toast("Contenu copié")).catch(fallback); else fallback();
}

const aBody = $("#aBody");
aBody.addEventListener("input", e => { if(e.target.id==="aSearch"){ aQ=e.target.value; renderAList(); } });
aBody.addEventListener("change", e => {
  const el=e.target;
  if(el.id==="aCatSel"){ aCat=el.value; renderAList(); return; }
  if(el.id==="importFile" && el.files[0]){
    const fr=new FileReader();
    fr.onload=()=>{ try{ const j=JSON.parse(fr.result); if(!j||!Array.isArray(j.products)||!Array.isArray(j.cats)) throw 0;
        STORE=normalizeStore(j); saveDraft(); renderAdmin(); toast("Fichier importé (brouillon)"); }
      catch(err){ $("#impMsg").textContent="Ce fichier n'est pas un products.json valide."; } };
    fr.readAsText(el.files[0]); return;
  }
  const k=el.dataset.k;
  if(k){
    const row=el.closest("[data-id]"), p=STORE.products.find(x=>x.id===+row.dataset.id); if(!p) return;
    if(k==="price") p.price=Math.max(0,Number(el.value)||0);
    else if(k==="old") p.old=el.value===""?null:(Number(el.value)||null);
    else if(k==="stock") p.stock=el.value===""?null:Math.max(0,parseInt(el.value)||0);
    else if(k==="visible") p.hidden=!el.checked;
    else if(k==="best") p.best=el.checked;
    row.querySelector(".a-name").innerHTML=nameHTML(p); saveDraft(); return;
  }
  const rk=el.dataset.rk;
  if(rk){ const r=STORE.reviews[+el.closest("[data-ri]").dataset.ri]; if(!r) return; r[rk]=el.value.trim(); if(rk==="text"&&!r.text){ STORE.reviews.splice(+el.closest("[data-ri]").dataset.ri,1); renderAdmin(); } saveDraft(); return; }
  const ck=el.dataset.ck;
  if(ck){ const c=STORE.cats[+el.closest("[data-ci]").dataset.ci]; if(!c) return; c[ck]=el.value.trim(); if(ck==="fr"&&!c.fr){c.fr="Catégorie";} saveDraft(); return; }
  const sk=el.dataset.sk;
  if(sk){
    const S=STORE.settings;
    if(sk==="whatsapp"){ S.whatsapp=el.value.replace(/\D/g,"")||S.whatsapp; el.value=S.whatsapp; }
    else if(sk==="rate"){ S.rate=Number(el.value)>0?Number(el.value):S.rate; el.value=S.rate; }
    else if(sk==="payMr"||sk==="payWave"){ S[sk]=el.value.trim()||S[sk]; el.value=S[sk]; }
    else if(sk.startsWith("social.")){ let u=el.value.trim(); if(u&&!/^https?:\/\//i.test(u)) u="https://"+u; S.social[sk.split(".")[1]]=u; el.value=u; }
    else if(sk.startsWith("announce.")) S.announce[sk.split(".")[1]]=el.value.trim();
    else if(sk.startsWith("info.")){ const q=sk.split("."); S.info[q[1]][q[2]]=el.value.trim(); }
    saveDraft();
  }
});
function slug(s){ return s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || "cat"; }
function arm(b,key,label,fn){
  if(armed && armed.k===key && Date.now()-armed.t<4000){ armed=null; fn(); return; }
  armed={k:key,t:Date.now()}; const old=b.textContent; b.textContent="Confirmer ?"; b.classList.add("armed");
  setTimeout(()=>{ if(b.isConnected && armed && armed.k===key){ b.textContent=old; b.classList.remove("armed"); armed=null; } },4000);
}
aBody.addEventListener("click", e => {
  const b=e.target.closest("[data-act]"); if(!b) return;
  const act=b.dataset.act, row=b.closest("[data-id]"), id=row?+row.dataset.id:null, ci=b.closest("[data-ci]"), idx=ci?+ci.dataset.ci:null;
  if(act==="new") openEdit(null);
  else if(act==="edit") openEdit(id);
  else if(act==="sold"){ const p=STORE.products.find(x=>x.id===id); if(!p) return;
    if(p.stock===null){ toast("Stock illimité : indiquez d'abord un nombre dans la case Stock."); return; }
    if(p.stock<=0){ toast("Déjà en rupture de stock."); return; }
    p.stock--; row.querySelector('[data-k=stock]').value=p.stock; row.querySelector(".a-name").innerHTML=nameHTML(p); saveDraft(); }
  else if(act==="del") arm(b,"p"+id,"Supprimer",()=>{ const i=STORE.products.findIndex(x=>x.id===id); if(i>=0) STORE.products.splice(i,1); saveDraft(); renderAdmin(); });
  else if(act==="up" && idx>0){ const c=STORE.cats.splice(idx,1)[0]; STORE.cats.splice(idx-1,0,c); saveDraft(); renderAdmin(); }
  else if(act==="down" && idx<STORE.cats.length-1){ const c=STORE.cats.splice(idx,1)[0]; STORE.cats.splice(idx+1,0,c); saveDraft(); renderAdmin(); }
  else if(act==="delcat"){
    const c=STORE.cats[idx], n=STORE.products.filter(p=>p.cat===c.id).length;
    if(n){ toast(n+" produit"+(n>1?"s utilisent":" utilise")+" cette catégorie : changez d'abord leur catégorie."); return; }
    arm(b,"c"+idx,"Supprimer",()=>{ STORE.cats.splice(idx,1); saveDraft(); renderAdmin(); });
  }
  else if(act==="addrev"){
    const tx=$("#nr-text").value.trim(); if(!tx){ $("#nrErr").textContent="Écrivez l'avis du client."; return; }
    STORE.reviews.push({name:$("#nr-name").value.trim(), text:tx}); saveDraft(); renderAdmin(); toast("Avis ajouté");
  }
  else if(act==="delrev"){ const i=+b.closest("[data-ri]").dataset.ri; arm(b,"r"+i,"Supprimer",()=>{ STORE.reviews.splice(i,1); saveDraft(); renderAdmin(); }); }
  else if(act==="addcat"){
    const fr=$("#nc-fr").value.trim(); if(!fr){ $("#ncErr").textContent="Le nom en français est obligatoire."; return; }
    let id=slug(fr), n=2; while(STORE.cats.some(c=>c.id===id)) id=slug(fr)+"-"+(n++);
    STORE.cats.push({id, e:$("#nc-e").value.trim()||"🏷️", fr, en:$("#nc-en").value.trim(), ar:$("#nc-ar").value.trim()});
    saveDraft(); renderAdmin(); toast("Catégorie ajoutée");
  }
  else if(act==="pw"){
    const a=$("#pw1").value, c=$("#pw2").value, m=$("#pwMsg");
    if(a.length<6){ m.textContent="6 caractères minimum."; return; }
    if(a!==c){ m.textContent="Les deux mots de passe sont différents."; return; }
    STORE.settings.adminHash=sha256(PWD_PREFIX+a); saveDraft(); $("#pw1").value=""; $("#pw2").value=""; m.textContent=""; toast("Mot de passe mis à jour (à publier)");
  }
  else if(act==="dl") downloadJSON();
  else if(act==="ghsave"){ safeSet("mb_gh",JSON.stringify(ghRead())); toast("Enregistré dans ce navigateur"); }
  else if(act==="ghpub") ghPublish();
  else if(act==="copy") copyJSON();
  else if(act==="revert") arm(b,"revert","",()=>{ safeDel("mb_draft"); STORE=normalizeStore(JSON.parse(pubJSON)); applyStore(); renderStatic(); renderAdmin(); toast("Brouillon supprimé"); });
});
