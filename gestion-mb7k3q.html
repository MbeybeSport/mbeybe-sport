<button class="btn" data-a="saves" ${busy?'disabled':''}>Enregistrer les textes, numéros et prix</button></div>`}
async function run(f,btn){if(busy)return;busy=true;const t=btn&&btn.textContent;if(btn){btn.disabled=true;btn.textContent='Enregistrement…'}let ok=false;try{await f();ok=true;note={ok:1,t:OKMSG}}catch(e){let t=e.message||String(e);if(e.diag)t+=' — '+await diag();note={t}}busy=false;if(ok)draw();try{window.scrollTo({top:0,behavior:'smooth'})}catch(e){}if(!ok){if(btn){btn.disabled=false;btn.textContent=t}$('note').innerHTML='<div class="er">'+esc(note.t)+'</div>'}}
function shrink(file,max){max=max||900;return new Promise((res,rej)=>{const i=new Image(),u=URL.createObjectURL(file);i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.85).split(',')[1])};i.onerror=()=>rej(new Error('Photo illisible. Essayez une photo JPG ou PNG.'));i.src=u})}

function linesHtml(){return OL.map((l,i)=>`<div class="row" style="grid-template-columns:1fr auto"><span>${esc(l.n)} ×${l.q}</span><span>${nf(l.p*l.q)} MRU <button class="sm d" data-a="ldel" data-i="${i}">✕</button></span></div>`).join('')+(OL.length?`<div class="row" style="grid-template-columns:1fr auto"><b>Total</b><b>${nf(OL.reduce((a,l)=>a+l.p*l.q,0))} MRU</b></div>`:'')}
function ordersView(){const ok=ORD.filter(o=>OKS.includes(o.s)),rev=ok.reduce((a,o)=>a+o.total,0),q={};ok.forEach(o=>o.l.forEach(l=>q[l.n]=(q[l.n]||0)+l.q));const top=Object.entries(q).sort((a,b)=>b[1]-a[1]).slice(0,5);
return`<div class="card"><h2>Ventes</h2><div class="g2"><div><b style="font-size:24px">${nf(rev)} MRU</b><div class="m">encaissés</div></div><div><b style="font-size:24px">${ok.length}</b><div class="m">commandes payées</div></div></div>${top.length?'<p class="m" style="margin-top:12px">Les plus vendus :</p>'+top.map(([n,v])=>`<div class="row" style="grid-template-columns:1fr auto"><span>${esc(n)}</span><b>${v}</b></div>`).join(''):''}</div>
<div class="card"><h2>Nouvelle commande</h2><p class="m">Notez ici les commandes reçues sur WhatsApp. Le stock baisse tout seul.</p><label>Nom du client</label><input id="oc_n"><label>Téléphone</label><input id="oc_t" type="tel"><label>Paiement</label><select id="oc_p"><option>Wave</option><option>Bankily</option><option>Masrvi</option><option>Sedad</option></select><label>Article</label><div class="g2"><select id="oc_sel">${CAT.map(p=>`<option value="${p.id}">${esc(p.nom)}</option>`).join('')}</select><input id="oc_q" type="number" min="1" value="1"></div><button class="sm" data-a="ladd" style="margin-top:8px">Ajouter l'article</button><div id="oc_l">${linesHtml()}</div><button class="btn" data-a="osave" ${busy?'disabled':''}>Enregistrer la commande</button></div>
<div class="card"><h2>Commandes</h2><p class="m">Les commandes sont gardées sur cet appareil uniquement (elles ne sont pas visibles par vos clients). Téléchargez-les de temps en temps.</p>${ORD.length?ORD.slice().reverse().map(o=>{const i=ORD.indexOf(o);return`<div class="row" style="grid-template-columns:1fr auto"><span><b>${esc(o.n)}</b> · ${esc(o.pay)}<small>${new Date(o.d).toLocaleDateString('fr')} · ${esc(o.t)}</small>${o.l.map(l=>esc(l.n)+' ×'+l.q).join(', ')}</span><span><b>${nf(o.total)} MRU</b><br><select data-os="${i}">${Object.entries(ST).map(([k,v])=>`<option value="${k}"${o.s==k?' selected':''}>${v}</option>`).join('')}</select></span></div>`}).join(''):'<p class="m">Aucune commande.</p>'}<button class="sm" data-a="csv" style="margin-top:10px">Télécharger mes commandes</button></div>`}
function view(){const nt=note?`<div class="${note.ok?'ok':'er'}">${esc(note.t)}</div>`:'';
const tabs=`<div class="tabs">${[['p','Produits et stock'],['n','Ajouter un produit'],['a','Avis clients'],['o','Commandes'],['s','Accueil et réglages']].map(t=>`<button data-a="tab" data-v="${t[0]}" aria-pressed="${tab==t[0]}">${t[1]}</button>`).join('')}</div>`;let b='';
if(tab=='p')b=`<div class="card"><p class="m">Changez le prix (en MRU) ou le stock. Stock vide = non suivi. Stock 0 = « Épuisé ». Décochez « Visible » pour cacher un produit.</p><div class="row h"><span>Produit</span><span>Prix MRU</span><span>Stock</span><span>Visible</span></div>${CAT.map((p,i)=>`<div class="row"><span>${esc(p.nom)}<small>${CL[p.cat]||''}${p.image?' · ajouté par vous':''}</small></span><input type="number" min="0" data-f="prix" data-i="${i}" value="${p.prix}" aria-label="Prix"><input type="number" min="0" data-f="stock" data-i="${i}" value="${p.stock??''}" aria-label="Stock"><input type="checkbox" data-f="vis" data-i="${i}" ${p.visible===0?'':'checked'} aria-label="Visible"></div>`).join('')}<button class="btn" data-a="savep" ${busy?'disabled':''}>Enregistrer les modifications</button></div>`;
if(tab=='n')b=`<div class="card"><h2>Ajouter un produit</h2><label>Nom du produit (français)</label><input id="np_n"><label>Nom en anglais (facultatif)</label><input id="np_e"><label>Nom en arabe (facultatif)</label><input id="np_r"><div class="g2"><div><label>Catégorie</label><select id="np_c">${Object.entries(CL).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div><div><label>Prix (MRU)</label><input id="np_p" type="number" min="0"></div></div><label>Stock (laisser vide si non suivi)</label><input id="np_s" type="number" min="0"><label>Photo du produit</label><input id="np_f" type="file" accept="image/*"><button class="btn" data-a="addp" ${busy?'disabled':''}>Ajouter à la boutique</button></div>${CAT.some(p=>p.image)?`<div class="card"><h2>Produits ajoutés par vous</h2>${CAT.map((p,i)=>p.image?`<div class="row" style="grid-template-columns:1fr auto"><span>${esc(p.nom)}</span><button class="sm d" data-a="delp" data-i="${i}">Supprimer</button></div>`:'').join('')}</div>`:''}`;
if(tab=='a')b=`<div class="card"><h2>Ajouter un avis client</h2><p class="m">N'ajoutez que de vrais avis reçus de vos clients.</p><label>Nom du client</label><input id="av_n"><label>Ville (facultatif)</label><input id="av_c"><label>Note</label><select id="av_r"><option value="5">5 étoiles</option><option value="4">4 étoiles</option><option value="3">3 étoiles</option><option value="2">2 étoiles</option><option value="1">1 étoile</option></select><label>Son avis</label><textarea id="av_t" rows="3"></textarea><button class="btn" data-a="adda" ${busy?'disabled':''}>Publier l'avis</button></div><div class="card"><h2>Avis publiés</h2>${AV.length?AV.map((a,i)=>`<div class="row" style="grid-template-columns:1fr auto"><span><b>${esc(a.n)}</b> ${esc(a.c||'')} · ${a.r}/5<small>${esc(a.t)}</small></span><button class="sm d" data-a="dela" data-i="${i}">Supprimer</button></div>`).join(''):'<p class="m">Aucun avis publié.</p>'}</div>`;
if(tab=='o')b=ordersView();
if(tab=='s')b=siteView();
return '<div id="note">'+nt+'</div>'+tabs+b+`<p><button class="sm" data-a="test">Tester ma clé</button> <button class="sm" data-a="out">Changer de clé</button></p>`}
function draw(){const t=document.activeElement&&document.activeElement.id;$('app').innerHTML=TOK?(CAT.length||note?view():'<p class="m">Chargement…</p>'):login()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,i=+b.dataset.i;
if(a=='login'){const k=$('k').value.trim();if(!k)return;if(!/^(ghp_|github_pat_)/.test(k)){alert('Cette clé semble incorrecte : elle doit commencer par ghp_');return}TOK=k;localStorage.setItem('mb_key',k);boot()}
else if(a=='test'){$('note').innerHTML='<div class="ok">Test en cours…</div>';diag().then(t=>{$('note').innerHTML='<div class="'+(t.includes('✔')?'ok':'er')+'">'+esc(t)+'</div>'})}
else if(a=='out'){localStorage.removeItem('mb_key');TOK='';CAT=[];note=null;draw()}
else if(a=='tab'){collectS();tab=b.dataset.v;note=null;draw()}
else if(a=='savep'){document.querySelectorAll('[data-f]').forEach(x=>{const p=CAT[+x.dataset.i],f=x.dataset.f;if(f=='prix'){const v=+x.value;if(x.value!==''&&v>=0)p.prix=v}else if(f=='stock'){p.stock=x.value===''?null:Math.max(0,Math.floor(+x.value))}else p.visible=x.checked?1:0});run(()=>saveC('Mise à jour des produits'),b)}
else if(a=='addp'){const V={n:$('np_n').value.trim(),e:$('np_e').value.trim(),r:$('np_r').value.trim(),c:$('np_c').value,p:$('np_p').value,s:$('np_s').value,f:$('np_f').files[0]};
run(async()=>{if(!V.n||V.p===''||+V.p<0||!V.f)throw new Error('Remplissez le nom, le prix et choisissez une photo.');const id='n'+Date.now().toString(36),b64=await shrink(V.f);
await put('images/'+id+'.jpg',b64,null,'Photo '+id);CAT.push({id,nom:V.n,nom_en:V.e||V.n,nom_ar:V.r||V.n,cat:V.c,prix:+V.p,stock:V.s===''?null:Math.floor(+V.s),visible:1,image:'images/'+id+'.jpg'});try{await saveC('Nouveau produit '+V.n)}catch(x){CAT.pop();throw x}},b)}
else if(a=='lg'){collectS();LG=b.dataset.v;draw()}
else if(a=='img'){const k=b.dataset.k,f=$('im_'+k).files[0];run(async()=>{if(!f)throw new Error('Choisissez d\'abord une photo.');const b64=await shrink(f,k.startsWith('tile')?800:1200),path='images/'+k+'-'+Date.now().toString(36)+'.jpg';await put(path,b64,null,'Photo '+k);const old=SITE.images[k];SITE.images[k]=path;try{await saveS('Photo '+k)}catch(x){if(old)SITE.images[k]=old;else delete SITE.images[k];throw x}},b)}
else if(a=='imgrst'){const k=b.dataset.k;run(async()=>{const old=SITE.images[k];delete SITE.images[k];try{await saveS('Photo d\'origine '+k)}catch(x){SITE.images[k]=old;throw x}},b)}
else if(a=='saves'){collectS();run(()=>saveS('Réglages de la boutique'),b)}
else if(a=='ladd'){const p=CAT.find(p=>p.id==$('oc_sel').value),q=Math.max(1,Math.floor(+$('oc_q').value||1));if(p){OL.push({id:p.id,n:p.nom,p:p.prix,q});$('oc_l').innerHTML=linesHtml()}}
else if(a=='ldel'){OL.splice(i,1);$('oc_l').innerHTML=linesHtml()}
else if(a=='osave'){const V={n:$('oc_n').value.trim(),t:$('oc_t').value.trim(),p:$('oc_p').value};run(async()=>{if(!V.n||!OL.length)throw new Error('Indiquez le nom du client et au moins un article.');const L=OL.slice(),ch=[];L.forEach(l=>{const p=CAT.find(p=>p.id==l.id);if(p&&p.stock!=null){ch.push([p,p.stock]);p.stock=Math.max(0,p.stock-l.q)}});
if(ch.length){try{await saveC('Stock après commande')}catch(x){ch.forEach(([p,s])=>p.stock=s);throw x}}ORD.push({id:Date.now(),d:Date.now(),n:V.n,t:V.t,pay:V.p,s:'pending',l:L,total:L.reduce((a,l)=>a+l.p*l.q,0)});sv();OL=[]},b)}
else if(a=='csv'){const r=[['Date','Client','Téléphone','Paiement','Statut','Articles','Total MRU']].concat(ORD.map(o=>[new Date(o.d).toLocaleDateString('fr'),o.n,o.t,o.pay,ST[o.s],o.l.map(l=>l.n+' x'+l.q).join(' | '),o.total]));const u=URL.createObjectURL(new Blob(['\ufeff'+r.map(x=>x.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\n')],{type:'text/csv'})),A=document.createElement('a');A.href=u;A.download='commandes-mbeybe.csv';A.click();URL.revokeObjectURL(u)}
else if(a=='delp'){if(!confirm('Supprimer ce produit de la boutique ?'))return;run(async()=>{const p=CAT.splice(i,1)[0];try{await saveC('Suppression '+p.nom)}catch(x){CAT.splice(i,0,p);throw x}},b)}
else if(a=='adda'){const V={n:$('av_n').value.trim(),c:$('av_c').value.trim(),r:+$('av_r').value,t:$('av_t').value.trim()};
run(async()=>{if(!V.n||V.t.length<5)throw new Error('Indiquez le nom du client et son avis.');AV.push({n:V.n,c:V.c,r:V.r,t:V.t});try{await saveA('Nouvel avis')}catch(x){AV.pop();throw x}},b)}
else if(a=='dela'){if(!confirm('Supprimer cet avis ?'))return;run(async()=>{const x=AV.splice(i,1)[0];try{await saveA('Suppression avis')}catch(y){AV.splice(i,0,x);throw y}},b)}});
document.addEventListener('change',e=>{const k=e.target.dataset.os;if(k===undefined)return;const o=ORD[+k],ns=e.target.value,was=o.s;if(was==ns)return;run(async()=>{const d=ns=='cancelled'?1:was=='cancelled'?-1:0,ch=[];if(d){o.l.forEach(l=>{const p=CAT.find(p=>p.id==l.id);if(p&&p.stock!=null){ch.push([p,p.stock]);p.stock=Math.max(0,p.stock+d*l.q)}});if(ch.length){try{await saveC('Stock')}catch(x){ch.forEach(([p,s])=>p.stock=s);throw x}}}o.s=ns;sv()})});
async function boot(){draw();if(!TOK)return;try{await load();note=null}catch(e){let t=e.message;if(e.diag)t+=' — '+await diag();note={t}}draw()}
boot();
</script></body></html>
